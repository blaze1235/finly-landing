<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finly. — Финансы под контролем</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  /* ─────────────────────────────────────────────────────────
     PAGE BASE
     ───────────────────────────────────────────────────────── */
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    overflow-x: hidden;
  }
  *, *::before, *::after { box-sizing: border-box; }

  /* Accent token — overridden by Tweaks */
  :root {
    --accent:      #D97706;
    --accent-soft: #FFFBEB;
    --accent-mid:  #FEF3C7;
  }

  /* Theme: dark mode flips page surfaces (phone bezels keep their own colors) */
  body.theme-dark {
    background: #0E0F12;
    color: #fff;
  }
  body.theme-dark .ln-section,
  body.theme-dark .ln-bg-surface { background: #15171B; }
  body.theme-dark .ln-text-ink   { color: #fff !important; }
  body.theme-dark .ln-text-muted { color: #8A8E98 !important; }
  body.theme-dark .ln-text-faint { color: #5C6068 !important; }
  body.theme-dark .ln-border     { border-color: #23262C !important; }
  body.theme-dark .ln-card       { background: #1B1E23 !important; border-color: #23262C !important; }
  body.theme-dark .ln-cta-primary { background: #fff !important; color: #111318 !important; }
  body.theme-dark .ln-hairline   { background: #23262C !important; }

  /* Small UI primitives used in the landing */
  .ln-eyebrow {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent);
  }
  .ln-cta-primary {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    background: var(--ink); color: #fff;
    padding: 16px 22px; border-radius: 14px;
    border: none; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 10px;
    transition: transform 120ms var(--ease-out), background 120ms;
  }
  .ln-cta-primary:hover  { background: #2a2a30; }
  .ln-cta-primary:active { transform: scale(0.97); }

  .ln-cta-secondary {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    background: transparent; color: var(--ink);
    padding: 16px 22px; border-radius: 14px;
    border: 1px solid var(--border); cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 10px;
    transition: background 120ms;
  }
  .ln-cta-secondary:hover { background: var(--hover); }
  body.theme-dark .ln-cta-secondary { color: #fff; border-color: #23262C; }
  body.theme-dark .ln-cta-secondary:hover { background: #1B1E23; }

  /* Section transitions */
  .ln-fade-up {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .6s var(--ease-out), transform .6s var(--ease-out);
  }
  .ln-fade-up.is-visible {
    opacity: 1; transform: translateY(0);
  }

  /* Hide nav scrollbars on phone */
  ::-webkit-scrollbar { display: none; }

  /* Make sure the bottom nav inside FinlyPhone is clickable in landing context */
  .ln-phone-wrap { isolation: isolate; }

  @keyframes ln-floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .ln-floaty { animation: ln-floaty 6s ease-in-out infinite; }

  /* Responsive tweaks */
  @media (max-width: 880px) {
    .ln-hero-split { grid-template-columns: 1fr !important; }
    .ln-hero-phone-col { justify-self: center !important; margin-top: 32px; }
    .ln-section-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .ln-h1 { font-size: 44px !important; }
    .ln-mosaic { grid-template-columns: 1fr !important; }
    .ln-three-up { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="ln-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Webapp UI kit (used to render live phones) -->
<script type="text/babel" src="webapp/components.jsx"></script>
<script type="text/babel" src="webapp/screens.jsx"></script>
<script type="text/babel" src="webapp/app.jsx"></script>

<!-- Tweaks panel + landing -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
</body>
</html>
